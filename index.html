<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>garden</title>
  <meta name="description" content="个人知识库：Markdown 源，Docsify 渲染">
  <link rel="stylesheet" href="//unpkg.com/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/docsify-garden.css">
</head>
<body>
  <div id="app"></div>
  <!-- mermaid 本地自托管，需在 docsify 之前加载 -->
  <script src="assets/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'base' })

    // Docsify 插件：渲染 ```mermaid 块。
    // 关键：必须在 marked/Prism 处理之前，把 mermaid 块替换成原始 HTML <div>，
    // 绕过 Docsify 的 code renderer（它会把源码当 markup 高亮、改掉 class）。
    function mermaidPlugin(hook) {
      hook.beforeEach(function (content) {
        return content.replace(/```mermaid\s*\n([\s\S]*?)```/g, function (m, code) {
          return '<div class="mermaid">\n' + code + '\n</div>'
        })
      })
      hook.doneEach(function () {
        if (typeof mermaid === 'undefined') return
        document.querySelectorAll('div.mermaid').forEach(function (el) {
          if (el.dataset.rendered) return
          el.dataset.rendered = '1'
          mermaid.render('mmd-' + Math.random().toString(36).slice(2, 8), el.textContent)
            .then(function (r) { el.innerHTML = r.svg })
            .catch(function (e) { console.error('mermaid render failed', e) })
        })
      })
    }

    window.$docsify = {
      basePath: 'notes/',
      name: 'garden',
      repo: 'bysomeone/garden',
      maxLevel: 4,
      search: 'auto',
      auto2top: true,
      loadSidebar: false,
      subMaxLevel: 3,
      plugins: [mermaidPlugin]
    }
  </script>
  <script src="//unpkg.com/docsify@4/lib/docsify.min.js"></script>
  <script src="//unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
